<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>TaskForge — Register</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container">
    <h1>Create account</h1>
    <p style="font-size:12px;color:#5e6c84">
      New accounts are created as <b>Employee</b>. A Manager/Admin can promote
      accounts later (that's an admin-only action, not exposed here).
    </p>
    <label>Username <span style="font-weight:400;color:#5e6c84">(3-32 chars, letters/numbers/underscore)</span></label>
    <input id="username" />
    <label>Password <span style="font-weight:400;color:#5e6c84">(min. 8 characters)</span></label>
    <input id="password" type="password" />
    <button onclick="register()">Register</button>
    <div class="error" id="err"></div>
    <p style="margin-top:16px;font-size:13px"><a href="/login.html">Back to login</a></p>
  </div>

  <script>
    async function register() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (res.ok) {
        window.location = '/login.html';
      } else {
        document.getElementById('err').textContent = data.error || 'Registration failed';
      }
    }
  </script>
</body>
</html>
