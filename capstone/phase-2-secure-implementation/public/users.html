<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TaskForge — Users</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="topbar" id="topbar-root"></div>

  <div class="container wide">
    <div class="page-header">
      <h1>All users</h1>
    </div>
    <p class="helper-note">Note: password hashes are never sent to the client, even here.</p>

    <div id="loading" class="loading-state"><span class="spinner"></span>Loading users…</div>
    <table id="table" style="display:none">
      <thead><tr><th>ID</th><th>Username</th><th>Role</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="error" id="err"></div>
  </div>

  <script src="/common.js"></script>
  <script>
    initTopbar();

    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    async function load() {
      const loading = document.getElementById('loading');
      const table = document.getElementById('table');
      let data;
      try {
        data = await apiFetch('/api/users');
      } catch (e) {
        loading.style.display = 'none';
        document.getElementById('err').textContent = e.message || 'Failed to load (forbidden?)';
        return;
      }
      loading.style.display = 'none';
      table.style.display = 'table';
      document.getElementById('rows').innerHTML = data.map((u) =>
        `<tr><td>#${escapeHtml(String(u.id))}</td><td>${escapeHtml(u.username)}</td><td><span class="role-badge ${escapeHtml(u.role)}">${escapeHtml(u.role)}</span></td></tr>`
      ).join('');
    }
    load();
  </script>
</body>
</html>
